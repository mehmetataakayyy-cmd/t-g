<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENİ HAYAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Sağ üst köşedeki hareketli yönlendirme balonu */
        .top-arrow {
            position: fixed;
            top: 12px;
            right: 18px;
            background: #0284c7;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            animation: bounce 0.8s infinite alternate;
            z-index: 999;
        }

        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-8px) scale(1.05); }
        }

        .card {
            background: #ffffff;
            padding: 40px 25px;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: #e0f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-box svg {
            width: 36px;
            height: 36px;
            fill: #0284c7;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .action-notice {
            background: #f0f9ff;
            border: 2px dashed #0284c7;
            border-radius: 16px;
            padding: 20px 15px;
            margin-top: 15px;
        }

        .action-notice p {
            font-size: 16px;
            font-weight: 700;
            color: #0369a1;
            line-height: 1.5;
        }

        .action-notice span {
            display: inline-block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- Sağ Üst Yönlendirme Balonu -->
    <div class="top-arrow">
        Sağ üstten "Tarayıcıda Aç" seçin ↗️
    </div>

    <div class="card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .54-1.42.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.19-1.82 6.98-3.02 8.37-3.6 3.98-1.65 4.81-1.94 5.35-1.95.12 0 .38.03.55.17.14.12.18.28.2.4.02.09.02.22-.01.37z"/>
            </svg>
        </div>

        <h1>YENİ HAYAT</h1>

        <div class="action-notice">
            <p>Devam etmek için sağ üstteki üç noktaya (⋮) tıklayıp "Tarayıcıda Aç" seçeneğini seçin.</p>
            <span>Devamında Telegram otomatik açılacaktır.</span>
        </div>
    </div>

</body>
</html>
