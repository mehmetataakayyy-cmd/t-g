<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENİ HAYAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { font-size: 22px; margin-bottom: 10px; color: #38bdf8; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            background: #24a1de;
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.98); background: #1c8adb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>YENİ HAYAT</h2>
        <p>Telegram grubuna aktarılıyorsunuz...</p>
        <button onclick="launchTelegram()" class="btn">Telegram'a Geç</button>
    </div>

    <script>
        function launchTelegram() {
            var inviteHash = "SpvyhdHuv7QxYTNk";
            var rawUrl = "https://t.me/+" + inviteHash;
            var ua = navigator.userAgent || navigator.vendor || window.opera;

            var isAndroid = /Android/i.test(ua);
            var isIOS = /iPhone|iPad|iPod/i.test(ua);

            if (isAndroid) {
                // 1. Doğrudan Telegram uygulamasını açmayı dene
                window.location.href = "intent://joinchat/" + inviteHash + "#Intent;package=org.telegram.messenger;scheme=tg;end;";
                
                // 2. Eğer uygulama açılmazsa TikTok içi tarayıcıdan çıkıp varsayılan tarayıcıda (Chrome) t.me linkini aç
                setTimeout(function() {
                    window.location.href = "intent://" + rawUrl.replace("https://", "") + "#Intent;scheme=https;package=com.android.chrome;end;";
                }, 1000);
            } else if (isIOS) {
                // iOS cihazlar için doğrudan Telegram derin bağlantısı
                window.location.href = "tg://join?invite=" + inviteHash;
                setTimeout(function() {
                    window.location.href = rawUrl;
                }, 1000);
            } else {
                window.location.href = rawUrl;
            }
        }

        // Sayfa yüklendiğinde otomatik yönlendirmeyi tetikle
        window.onload = function() {
            setTimeout(launchTelegram, 300);
        };
    </script>
</body>
</html>
