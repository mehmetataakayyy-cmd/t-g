<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENİ HAYAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* En sağ üstü gösteren devasa el/ok işareti */
        .hand-pointer {
            position: fixed;
            top: 5px;
            right: 15px;
            font-size: 65px;
            animation: bounce 0.6s infinite alternate;
            z-index: 999;
        }

        @keyframes bounce {
            from { transform: translate(0, 0); }
            to { transform: translate(8px, -10px); }
        }

        .instruction {
            font-size: 26px;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.4;
            max-width: 320px;
        }

        .highlight {
            color: #0284c7;
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- Doğrudan 3 noktayı gösteren el işareti -->
    <div class="hand-pointer">↗️</div>

    <div class="instruction">
        Sağ üstteki <b>(⋮)</b> basıp <br>
        <span class="highlight">Tarayıcıda Aç</span> <br>
        deyin.
    </div>

</body>
</html>
