<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENİ HAYAT - Telegram Katılım</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { font-size: 22px; margin-bottom: 10px; color: #38bdf8; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            background: #24a1de;
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); background: #1c8adb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>YENİ HAYAT</h2>
        <p>Telegram grubumuza katılmak için aşağıdaki butona dokunun.</p>
        <a href="tg://join?invite=SpvyhdHuv7QxYTNk" class="btn" onclick="setTimeout(function(){ window.location.href='https://t.me/+SpvyhdHuv7QxYTNk'; }, 500);">
            Telegram Grubuna Katıl
        </a>
    </div>
</body>
</html>
