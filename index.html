<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENİ HAYAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #ffffff;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* TikTok içi tarayıcıda gözüken ok */
        .hand-pointer {
            position: fixed;
            top: 5px;
            right: 15px;
            font-size: 60px;
            animation: bounce 0.6s infinite alternate;
            z-index: 999;
        }

        @keyframes bounce {
            from { transform: translate(0, 0); }
            to { transform: translate(8px, -10px); }
        }

        .instruction {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .highlight {
            color: #0284c7;
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 8px;
            display: inline-block;
        }

        .btn {
            display: inline-block;
            width: 100%;
            max-width: 300px;
            background: #229ed9;
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(34, 158, 217, 0.35);
        }
    </style>
</head>
<body>

    <div class="hand-pointer">↗️</div>

    <div class="instruction">
        Sağ üstteki <b>(⋮)</b> basıp <br>
        <span class="highlight">Tarayıcıda Aç</span> <br>
        deyin.
    </div>

    <a href="https://t.me/+SpvyhdHuv7QxYTNk" class="btn" id="tgBtn">
        Telegram'ı Aç
    </a>

    <script>
        // Kullanıcı TikTok dışındaki normal bir tarayıcıdaysa doğrudan Telegram'a yönlendir
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        var isTikTok = /musical_ly|ByteLocale|TikTok/i.test(ua);

        if (!isTikTok) {
            // TikTok dışındayız (Chrome/Safari), hemen Telegram linkine git
            window.location.href = "https://t.me/+SpvyhdHuv7QxYTNk";
        }
    </script>

</body>
</html>
